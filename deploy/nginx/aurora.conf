# Aurora — nginx site for aurora.artdevelopers.site
#
# Serves the built frontend and proxies the API. After DNS resolves, run:
#   sudo certbot --nginx -d aurora.artdevelopers.site
# and certbot will add the TLS block itself.

server {
    listen 80;
    listen [::]:80;
    server_name aurora.artdevelopers.site;

    # Scans and logo uploads go through the API
    client_max_body_size 15m;

    access_log /var/log/nginx/aurora.access.log;
    error_log  /var/log/nginx/aurora.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/aurora;
    index index.html;

    # API + uploaded files
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sessions ride an httpOnly cookie — do not strip it
        proxy_pass_request_headers on;
        proxy_read_timeout 300s;   # the vision model can take ~1 minute
        proxy_send_timeout 300s;
    }

    # Long-lived hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: every other path serves the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
